name: Relay smoke test

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: relay-smoke

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  smoke:
    name: Smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/997327858649/locations/global/workloadIdentityPools/github/providers/otter-mail

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Smoke test production
        run: pnpm --filter @otter/relay smoke

      - name: Open or update the failure issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"Relay smoke test failing\"" --json number --jq '.[0].number')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Relay smoke test failing" --body "The production relay's smoke test failed: $RUN_URL"
          fi

      - name: Close the failure issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for issue in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"Relay smoke test failing\"" --json number --jq '.[].number'); do
            gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --comment "Passing again: $RUN_URL"
          done
