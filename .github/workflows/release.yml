name: Release

# One workflow for every app. A push to main ships the apps its commits changed; a run by hand
# ships whatever main has that an app's last release doesn't, or the apps it names
# (scripts/release-plan.ts decides; the run's summary says what it chose).
on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
      - "!v*-*"
  workflow_dispatch:
    inputs:
      channel:
        description: "Mac, Linux and web: a nightly, or the latest nightly as stable"
        required: true
        default: nightly
        type: choice
        options:
          - nightly
          - stable
      apps:
        description: "What to release. auto: each app that changed since its last release"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - desktop
          - iphone
          - agents
          - all
      bump:
        description: "iPhone apps: version bump from the app's latest release"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: Exact version instead (e.g. 1.0.0), for a stable release or one iPhone app
        required: false
        type: string

# A stable release waits, whole, for the one before it. Nightlies start at once
# and take turns job by job, below.
concurrency:
  group: release-${{ ((github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')) || inputs.channel == 'nightly') && github.run_id || 'stable' }}
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

env:
  # electron-builder downloads its own Electron per architecture.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  plan:
    name: What to release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      desktop: ${{ steps.apps.outputs.desktop }}
      iphone: ${{ steps.apps.outputs.iphone }}
      agents: ${{ steps.apps.outputs.agents }}
      ref: ${{ steps.source.outputs.ref }}
      channel: ${{ steps.source.outputs.channel }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      name: ${{ steps.meta.outputs.name }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      make_latest: ${{ steps.meta.outputs.make_latest }}
      previous_tag: ${{ steps.meta.outputs.previous_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: source
        name: Resolve release commit
        uses: actions/github-script@v8
        env:
          DISPATCH_CHANNEL: ${{ inputs.channel }}
        with:
          script: |
            const {
              assertCommitOnDefaultBranch,
              assertReleaseSource,
              resolveReleaseChannel,
              resolveLatestNightlyCommit,
            } = require('./.github/scripts/release-source.cjs');
            const releaseChannel = resolveReleaseChannel(context, process.env.DISPATCH_CHANNEL);
            core.setOutput('channel', releaseChannel);
            await assertReleaseSource({ github, context, releaseChannel });
            if (context.eventName === 'workflow_dispatch' && releaseChannel === 'stable') {
              const { tag, sha, version } = await resolveLatestNightlyCommit({ github, context, core });
              await assertCommitOnDefaultBranch({ github, context, sha });
              core.notice(`Stable release builds ${sha}, the commit shipped by ${tag}.`);
              core.setOutput('ref', sha);
              core.setOutput('nightly_version', version);
            } else {
              core.setOutput('ref', context.sha);
            }

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          package-manager-cache: false

      - id: apps
        name: Choose the apps
        env:
          EVENT: ${{ github.event_name }}
          CHANNEL: ${{ steps.source.outputs.channel }}
          APPS: ${{ inputs.apps }}
          VERSION: ${{ inputs.version }}
          BEFORE: ${{ github.event.before }}
        run: >
          node scripts/release-plan.ts --github-output
          --event "$EVENT" --channel "$CHANNEL" --apps "$APPS" --version "$VERSION"
          --before "$BEFORE" --after "$GITHUB_SHA"

      - id: meta
        name: Resolve release version
        if: steps.apps.outputs.desktop == 'true'
        env:
          CHANNEL: ${{ steps.source.outputs.channel }}
          NIGHTLY_VERSION: ${{ steps.source.outputs.nightly_version }}
          NIGHTLY_SHA: ${{ steps.source.outputs.ref }}
          NIGHTLY_RUN_NUMBER: ${{ github.run_number }}
          VERSION: ${{ inputs.version }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          args=(--github-output)
          if [[ "$CHANNEL" == "nightly" ]]; then
            args+=(--channel nightly --date "$(date -u +%Y%m%d)" --run-number "$NIGHTLY_RUN_NUMBER" --sha "$NIGHTLY_SHA")
          elif [[ -n "$TAG" ]]; then
            args+=(--tag "$TAG")
          else
            args+=(--version "${VERSION:-$NIGHTLY_VERSION}")
          fi
          node scripts/resolve-release-version.ts "${args[@]}"

  # A newer nightly takes over from one still checking or building: its jobs cancel
  # these, so the older run publishes nothing.
  quality:
    name: Checks
    needs: [plan]
    if: needs.plan.outputs.desktop == 'true'
    concurrency:
      group: release-${{ needs.plan.outputs.channel }}-quality
      cancel-in-progress: ${{ needs.plan.outputs.channel == 'nightly' }}
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ needs.plan.outputs.ref }}
      # A stable release is the last gate: it replays nothing.
      fresh: ${{ needs.plan.outputs.channel == 'stable' }}

  build_mac:
    name: Build macOS (Apple Silicon)
    needs: [plan]
    if: needs.plan.outputs.desktop == 'true'
    # Needs Xcode 26+ for the translator; see .github/actions/select-xcode.
    runs-on: macos-15
    timeout-minutes: 60
    concurrency:
      group: release-${{ needs.plan.outputs.channel }}-mac
      cancel-in-progress: ${{ needs.plan.outputs.channel == 'nightly' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.ref }}

      - name: Setup
        uses: ./.github/actions/setup

      - name: Select Xcode
        uses: ./.github/actions/select-xcode
        with:
          xcode-app: ${{ vars.XCODE_APP }}

      - name: Build desktop artifacts
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          OTTER_GOOGLE_CLIENT_ID: ${{ vars.OTTER_GOOGLE_CLIENT_ID }}
          OTTER_GOOGLE_CLIENT_SECRET: ${{ secrets.OTTER_MAIL_GOOGLE_CLIENT_SECRET }}
          # Outlook's sign-in (a public client: no secret); without it the app offers no Outlook.
          OTTER_MICROSOFT_CLIENT_ID: ${{ vars.OTTER_MICROSOFT_CLIENT_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # The Developer ID provisioning profile (base64) granting communication notifications:
          # agents' notifications then show the agent's picture.
          MAC_PROVISIONING_PROFILE: ${{ secrets.MAC_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          if [[ -z "$OTTER_GOOGLE_CLIENT_ID" || -z "$OTTER_GOOGLE_CLIENT_SECRET" ]]; then
            echo "::error::Set the OTTER_GOOGLE_CLIENT_ID variable and OTTER_GOOGLE_CLIENT_SECRET secret; without them the app can't sign in to Google."
            exit 1
          fi
          args=(--platform mac --target dmg --arch arm64 --build-version "$VERSION" --verbose)

          if [[ -n "$CSC_LINK" && -n "$CSC_KEY_PASSWORD" && -n "$APPLE_API_KEY" && -n "$APPLE_API_KEY_ID" && -n "$APPLE_API_ISSUER" ]]; then
            # electron-builder's notarization reads APPLE_API_KEY as a path to the .p8.
            key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s' "$APPLE_API_KEY" > "$key_path"
            export APPLE_API_KEY="$key_path"
            echo "macOS signing and notarization enabled."
            args+=(--signed)
            if [[ -n "$MAC_PROVISIONING_PROFILE" ]]; then
              export OTTER_MAC_PROVISIONING_PROFILE="$RUNNER_TEMP/otter.provisionprofile"
              printf '%s' "$MAC_PROVISIONING_PROFILE" | base64 --decode > "$OTTER_MAC_PROVISIONING_PROFILE"
            fi
          else
            echo "::warning::Building UNSIGNED (ad hoc). Set CSC_LINK, CSC_KEY_PASSWORD, APPLE_API_KEY, APPLE_API_KEY_ID and APPLE_API_ISSUER to sign and notarize."
          fi

          node scripts/build-desktop-artifact.ts "${args[@]}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-mac
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/*.yml
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  build_linux:
    name: Build Linux (.deb, x64 and arm64)
    needs: [plan]
    if: needs.plan.outputs.desktop == 'true'
    # The app is bundled JavaScript on Electron: one runner packages both
    # architectures (electron-builder fetches each one's Electron).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: release-${{ needs.plan.outputs.channel }}-linux
      cancel-in-progress: ${{ needs.plan.outputs.channel == 'nightly' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.ref }}

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build desktop artifacts
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          OTTER_GOOGLE_CLIENT_ID: ${{ vars.OTTER_GOOGLE_CLIENT_ID }}
          OTTER_GOOGLE_CLIENT_SECRET: ${{ secrets.OTTER_MAIL_GOOGLE_CLIENT_SECRET }}
          # Outlook's sign-in (a public client: no secret); without it the app offers no Outlook.
          OTTER_MICROSOFT_CLIENT_ID: ${{ vars.OTTER_MICROSOFT_CLIENT_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
        run: |
          set -euo pipefail
          if [[ -z "$OTTER_GOOGLE_CLIENT_ID" || -z "$OTTER_GOOGLE_CLIENT_SECRET" ]]; then
            echo "::error::Set the OTTER_GOOGLE_CLIENT_ID variable and OTTER_GOOGLE_CLIENT_SECRET secret; without them the app can't sign in to Google."
            exit 1
          fi
          node scripts/build-desktop-artifact.ts --platform linux --arch x64 --build-version "$VERSION"
          node scripts/build-desktop-artifact.ts --platform linux --arch arm64 --build-version "$VERSION" --skip-build

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-linux
          path: |
            release/*.deb
            release/*.yml
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release:
    name: Publish GitHub release
    needs: [plan, quality, build_mac, build_linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # In turn within a channel, and never cancelled: it may be publishing.
    concurrency:
      group: release-${{ needs.plan.outputs.channel }}-publish
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          package-manager-cache: false

      # The version's changelog note (if main has one) goes above GitHub's
      # generated notes, so the release and the site's changelog say the same.
      - name: Changelog note
        if: needs.plan.outputs.prerelease == 'false'
        run: node scripts/changelog-release-notes.ts "${{ needs.plan.outputs.version }}" > "$RUNNER_TEMP/notes.md"

      # Each release carries only its own latest-* or nightly-* update feeds.
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          target_commitish: ${{ needs.plan.outputs.ref }}
          name: ${{ needs.plan.outputs.name }}
          body_path: ${{ needs.plan.outputs.prerelease == 'false' && format('{0}/notes.md', runner.temp) || '' }}
          generate_release_notes: true
          previous_tag: ${{ needs.plan.outputs.previous_tag }}
          prerelease: ${{ needs.plan.outputs.prerelease }}
          make_latest: ${{ needs.plan.outputs.make_latest }}
          files: release-assets/*
          fail_on_unmatched_files: true

  # Tells Sentry which commits the version holds, so an issue a commit says
  # `Fixes <SHORT-ID>` to resolves with it. Bookkeeping: never fails the release.
  sentry_release:
    name: Sentry release
    needs: [plan, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.ref }}
          fetch-depth: 0

      - name: Create the release
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
        with:
          release: otter-mail@${{ needs.plan.outputs.version }}
          projects: otter-mail-desktop otter-mail-web
          environment: ${{ needs.plan.outputs.prerelease == 'true' && 'nightly' || 'stable' }}
          set_commits: auto
          ignore_missing: true
          ignore_empty: true

  # A nightly's web app goes out once its checks pass, alongside the desktop builds;
  # a stable one waits for its GitHub release.
  deploy_web_nightly:
    name: Deploy the web app (nightly)
    needs: [plan, quality]
    if: needs.plan.outputs.prerelease == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: deploy-web-nightly
      cancel-in-progress: false
    steps: &deploy_web_steps
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.ref }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Build and deploy
        working-directory: site
        env:
          OTTER_VERSION: ${{ needs.plan.outputs.version }}
          NIGHTLY: ${{ needs.plan.outputs.prerelease }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN secret and CLOUDFLARE_ACCOUNT_ID variable (Workers Scripts: Edit) to deploy the web app."
            exit 1
          fi
          node scripts/build.ts
          if [[ "$NIGHTLY" == "true" ]]; then
            pnpm exec wrangler deploy --env nightly
          else
            pnpm exec wrangler deploy
          fi

  deploy_web:
    name: Deploy the web app
    needs: [plan, release]
    if: needs.plan.outputs.prerelease == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: deploy-web-stable
      cancel-in-progress: false
    steps: *deploy_web_steps

  finalize:
    name: Bump package versions on main
    needs: [plan, release]
    if: needs.plan.outputs.prerelease == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          package-manager-cache: false

      - id: bump
        name: Update versions
        run: node scripts/update-release-package-versions.ts "${{ needs.plan.outputs.version }}" --github-output

      - name: Commit and push
        if: steps.bump.outputs.changed == 'true'
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/package.json apps/web/package.json
          git commit -m "chore(release): $TAG"
          # The iPhone release also pushes a version bump to main; don't collide with it.
          for attempt in 1 2 3; do
            git pull --rebase origin "${{ github.event.repository.default_branch }}"
            if git push origin HEAD; then exit 0; fi
            sleep 5
          done
          echo "::error::Couldn't push the version bump to main."
          exit 1

  # The iPhone apps ship on their own, each with its own version and tags (ios-vX.Y.Z,
  # ios-agents-vX.Y.Z), to TestFlight. One release of an app at a time; while one runs, only
  # the newest waits.
  iphone:
    name: Otter Mail for iPhone
    needs: [plan]
    if: needs.plan.outputs.iphone == 'true'
    # The runner's default Xcode (a release, never a beta: App Store Connect
    # refuses beta builds).
    runs-on: xcode-27
    timeout-minutes: 45
    concurrency:
      group: release-iphone
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      # What scripts/release-ios.ts and scripts/resolve-release-version.ts call the app.
      IOS_APP: mail
      VERSION_APP: ios
      VERSION_FILE: apps/mail-mobile/package.json
      PROFILE_SECRET: IOS_PROVISIONING_PROFILE
      NOTIFICATION_PROFILE_SECRET: IOS_NOTIFICATION_PROVISIONING_PROFILE
    steps: &ios_steps
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          package-manager-cache: false

      # Here, once it is this release's turn: the version after the one that just shipped.
      - id: meta
        name: Resolve release version
        env:
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
        run: |
          args=(--app "$VERSION_APP" --github-output)
          if [[ -n "$VERSION" ]]; then args+=(--version "$VERSION");
          else args+=(--bump "${BUMP:-patch}"); fi
          node scripts/resolve-release-version.ts "${args[@]}"

      - name: Setup Expo workspace
        uses: ./.github/actions/setup

      - name: Install signing
        env:
          DISTRIBUTION_P12: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets[env.PROFILE_SECRET] }}
          NOTIFICATION_PROVISIONING_PROFILE: ${{ secrets[env.NOTIFICATION_PROFILE_SECRET] }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          for name in DISTRIBUTION_P12 DISTRIBUTION_P12_PASSWORD PROVISIONING_PROFILE NOTIFICATION_PROVISIONING_PROFILE APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing $name. Set the IOS_DISTRIBUTION_P12, IOS_DISTRIBUTION_P12_PASSWORD, $PROFILE_SECRET, $NOTIFICATION_PROFILE_SECRET and APPLE_API_KEY* secrets (docs/release.md)."
              exit 1
            fi
          done
          xcodebuild -version

          # The Apple Distribution identity, in a keychain of its own for this run.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$DISTRIBUTION_P12" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          security import "$RUNNER_TEMP/distribution.p12" -k "$keychain" -P "$DISTRIBUTION_P12_PASSWORD" -f pkcs12 -A
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/distribution.p12"

          # The app's and its notification extension's App Store profiles, where Xcode looks.
          profiles="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$profiles"
          for profile in "$PROVISIONING_PROFILE" "$NOTIFICATION_PROVISIONING_PROFILE"; do
            printf '%s' "$profile" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
            uuid="$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID raw -)"
            mv "$RUNNER_TEMP/profile.mobileprovision" "$profiles/$uuid.mobileprovision"
          done

          # The App Store Connect API key the upload signs in with.
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY" > "$key_path"
          {
            echo "OTTER_ASC_KEY=$key_path"
            echo "OTTER_ASC_KEY_ID=$APPLE_API_KEY_ID"
            echo "OTTER_ASC_ISSUER=$APPLE_API_ISSUER"
          } >> "$GITHUB_ENV"

      - id: upload
        name: Build and upload
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
        run: node scripts/release-ios.ts --app "$IOS_APP" --version "$VERSION" --github-output

      - name: Remove signing
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      # Only once App Store Connect has the build, so a failed run leaves nothing behind.
      - name: Tag, bump and push
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # An Otter Agents build records the runtime it runs, which its updates must match
          # (scripts/agents-runtime.ts).
          if [[ -n "${OTTER_AGENTS_RUNTIME_VERSION:-}" ]]; then
            git tag -a "$TAG" -m "Otter Agents runtime: $OTTER_AGENTS_RUNTIME_VERSION" "$GITHUB_SHA"
          else
            git tag "$TAG" "$GITHUB_SHA"
          fi
          git push origin "$TAG"

          git fetch origin "$BRANCH"
          git checkout --force -B "$BRANCH" FETCH_HEAD
          node -e 'const fs = require("node:fs"); const [file, version] = process.argv.slice(1); const app = JSON.parse(fs.readFileSync(file, "utf8")); app.version = version; fs.writeFileSync(file, JSON.stringify(app, null, 2) + "\n");' "$VERSION_FILE" "$VERSION"
          if git diff --quiet -- "$VERSION_FILE"; then exit 0; fi
          git add "$VERSION_FILE"
          git commit -m "chore(release): $TAG"
          # The other releases also push a version bump to main; don't collide with them.
          for attempt in 1 2 3; do
            git pull --rebase origin "$BRANCH"
            if git push origin "HEAD:$BRANCH"; then exit 0; fi
            sleep 5
          done
          echo "::error::Couldn't push the version bump to main."
          exit 1

      # The release the app reports under, with every commit since its last one, so
      # `Fixes OTTER-MAIL-IOS-…` (or OTTER-AGENTS-IOS-…) resolves its issue. Bookkeeping: never
      # fails the release (docs/error-reports.md has the command to run it again).
      - name: Sentry release
        continue-on-error: true
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD: ${{ steps.upload.outputs.build }}
          REPOSITORY: ${{ github.repository }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
        run: >-
          node scripts/sentry-release-ios.ts --app "$IOS_APP" --version "$VERSION" --build "$BUILD"
          --repository "$REPOSITORY" --ref "$GITHUB_SHA"

  # Otter Agents builds only when its native code changed since its last build, as t3code's
  # app does: otherwise its JavaScript reaches that build as an update (EAS Update), in a minute
  # instead of a build's half hour. A run by hand always builds.
  agents-plan:
    name: Otter Agents, build or update
    needs: [plan]
    if: needs.plan.outputs.agents == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.runtime.outputs.mode }}
      runtime: ${{ steps.runtime.outputs.runtime }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Expo workspace
        uses: ./.github/actions/setup

      - id: runtime
        name: Compare with the last build
        run: node scripts/agents-runtime.ts --github-output ${{ github.event_name == 'workflow_dispatch' && '--build' || '' }}

  agents-update:
    name: Otter Agents update
    needs: [agents-plan]
    if: needs.agents-plan.outputs.mode == 'update'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: release-agents
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    env:
      OTTER_APP_VARIANT: production
      OTTER_AGENTS_RELEASE_BUILD: "1"
      OTTER_AGENTS_RUNTIME_VERSION: ${{ needs.agents-plan.outputs.runtime }}
      EXPO_NO_DOTENV: "1"
      EXPO_NO_CLIENT_ENV_VARS: "1"
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Expo workspace
        uses: ./.github/actions/setup

      # A build that finished while this run waited may run other native code: then this commit
      # needs a build of its own, and main gets one (it has this commit).
      - id: still
        name: Still the last build's runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/agents-runtime.ts --github-output
          if [[ "$(grep '^mode=' "$GITHUB_OUTPUT" | tail -n 1)" == "mode=build" ]]; then
            echo "::notice::A build with other native code finished meanwhile: building main instead."
            gh workflow run release.yml --ref "${{ github.event.repository.default_branch }}" -f apps=agents
          fi

      # Updates publish one at a time but may arrive out of order: a commit older than the one
      # this runtime's last update came from would take its place on phones. The tag
      # ios-agents-update-<runtime> records that commit, before publishing, so a failed push
      # publishes nothing.
      - name: Publish the update
        if: steps.still.outputs.mode == 'update'
        working-directory: apps/agents-mobile
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          tag="ios-agents-update-$OTTER_AGENTS_RUNTIME_VERSION"
          if last="$(git rev-parse -q --verify "refs/tags/$tag^{commit}")" &&
            [[ "$last" != "$GITHUB_SHA" ]] && git merge-base --is-ancestor "$GITHUB_SHA" "$last"; then
            echo "::notice::$last, a newer commit, already shipped as this runtime's update: not publishing."
            exit 0
          fi
          git tag -f "$tag" "$GITHUB_SHA"
          git push -f origin "refs/tags/$tag"
          npx --yes eas-cli@27.11.0 update --channel production --platform ios \
            --message "$(printf '%s' "$MESSAGE" | head -n 1)" --non-interactive

  agents:
    name: Otter Agents for iPhone
    needs: [plan, agents-plan]
    if: needs.agents-plan.outputs.mode == 'build'
    runs-on: xcode-27
    timeout-minutes: 45
    concurrency:
      group: release-agents
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      IOS_APP: agents
      OTTER_AGENTS_RUNTIME_VERSION: ${{ needs.agents-plan.outputs.runtime }}
      VERSION_APP: agents
      VERSION_FILE: apps/agents-mobile/package.json
      PROFILE_SECRET: IOS_AGENTS_PROVISIONING_PROFILE
      NOTIFICATION_PROFILE_SECRET: IOS_AGENTS_NOTIFICATION_PROVISIONING_PROFILE
    steps: *ios_steps
