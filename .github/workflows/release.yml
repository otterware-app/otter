name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
      - "!v*-*"
    # What the desktop and web apps don't ship. GitHub applies path filters to
    # branch pushes only, so a tag always releases.
    paths-ignore:
      - "apps/ios/**"
      - "docs/**"
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        default: nightly
        type: choice
        options:
          - nightly
          - stable
      version:
        description: Stable version override (e.g. 1.0.0); defaults to the version previewed by the latest nightly
        required: false
        type: string

# A stable release waits, whole, for the one before it. Nightlies start at once
# and take turns job by job, below.
concurrency:
  group: release-${{ ((github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')) || inputs.channel == 'nightly') && github.run_id || 'stable' }}
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

env:
  # electron-builder downloads its own Electron per architecture.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  resolve_commit:
    name: Resolve release commit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      nightly_version: ${{ steps.resolve.outputs.nightly_version }}
      channel: ${{ steps.resolve.outputs.channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts

      - id: resolve
        name: Resolve release commit
        uses: actions/github-script@v8
        env:
          DISPATCH_CHANNEL: ${{ inputs.channel }}
        with:
          script: |
            const {
              assertCommitOnDefaultBranch,
              assertReleaseSource,
              resolveReleaseChannel,
              resolveLatestNightlyCommit,
            } = require('./.github/scripts/release-source.cjs');
            const releaseChannel = resolveReleaseChannel(context, process.env.DISPATCH_CHANNEL);
            core.setOutput('channel', releaseChannel);
            await assertReleaseSource({ github, context, releaseChannel });
            if (context.eventName === 'workflow_dispatch' && releaseChannel === 'stable') {
              const { tag, sha, version } = await resolveLatestNightlyCommit({ github, context, core });
              await assertCommitOnDefaultBranch({ github, context, sha });
              core.notice(`Stable release builds ${sha}, the commit shipped by ${tag}.`);
              core.setOutput('ref', sha);
              core.setOutput('nightly_version', version);
            } else {
              core.setOutput('ref', context.sha);
            }

  preflight:
    name: Preflight
    needs: [resolve_commit]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      ref: ${{ needs.resolve_commit.outputs.ref }}
      channel: ${{ needs.resolve_commit.outputs.channel }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      name: ${{ steps.meta.outputs.name }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      make_latest: ${{ steps.meta.outputs.make_latest }}
      previous_tag: ${{ steps.meta.outputs.previous_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve_commit.outputs.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          package-manager-cache: false

      - id: meta
        name: Resolve release version
        env:
          CHANNEL: ${{ needs.resolve_commit.outputs.channel }}
          NIGHTLY_VERSION: ${{ needs.resolve_commit.outputs.nightly_version }}
          NIGHTLY_SHA: ${{ needs.resolve_commit.outputs.ref }}
          NIGHTLY_RUN_NUMBER: ${{ github.run_number }}
          VERSION: ${{ inputs.version }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          args=(--github-output)
          if [[ "$CHANNEL" == "nightly" ]]; then
            args+=(--channel nightly --date "$(date -u +%Y%m%d)" --run-number "$NIGHTLY_RUN_NUMBER" --sha "$NIGHTLY_SHA")
          elif [[ -n "$TAG" ]]; then
            args+=(--tag "$TAG")
          else
            args+=(--version "${VERSION:-$NIGHTLY_VERSION}")
          fi
          node scripts/resolve-release-version.ts "${args[@]}"

  # A newer nightly takes over from one still checking or building: its jobs cancel
  # these, so the older run publishes nothing.
  quality:
    name: Release quality checks
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: release-${{ needs.preflight.outputs.channel }}-quality
      cancel-in-progress: ${{ needs.preflight.outputs.channel == 'nightly' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Verify release
        run: |
          vp run fmt:check
          vp run lint
          vp run typecheck
          vp run test
          node --test scripts/release.test.ts .github/scripts/release-source.test.cjs

  build_mac:
    name: Build macOS (Apple Silicon)
    needs: [preflight]
    # Needs Xcode 26+ for the translator; see .github/actions/select-xcode.
    runs-on: macos-15
    timeout-minutes: 60
    concurrency:
      group: release-${{ needs.preflight.outputs.channel }}-mac
      cancel-in-progress: ${{ needs.preflight.outputs.channel == 'nightly' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Select Xcode
        uses: ./.github/actions/select-xcode
        with:
          xcode-app: ${{ vars.XCODE_APP }}

      - name: Build desktop artifacts
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          OTTER_GOOGLE_CLIENT_ID: ${{ vars.OTTER_GOOGLE_CLIENT_ID }}
          OTTER_GOOGLE_CLIENT_SECRET: ${{ secrets.OTTER_MAIL_GOOGLE_CLIENT_SECRET }}
          # Outlook's sign-in (a public client: no secret); without it the app offers no Outlook.
          OTTER_MICROSOFT_CLIENT_ID: ${{ vars.OTTER_MICROSOFT_CLIENT_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          if [[ -z "$OTTER_GOOGLE_CLIENT_ID" || -z "$OTTER_GOOGLE_CLIENT_SECRET" ]]; then
            echo "::error::Set the OTTER_GOOGLE_CLIENT_ID variable and OTTER_GOOGLE_CLIENT_SECRET secret; without them the app can't sign in to Google."
            exit 1
          fi
          args=(--platform mac --target dmg --arch arm64 --build-version "$VERSION" --verbose)

          if [[ -n "$CSC_LINK" && -n "$CSC_KEY_PASSWORD" && -n "$APPLE_API_KEY" && -n "$APPLE_API_KEY_ID" && -n "$APPLE_API_ISSUER" ]]; then
            # electron-builder's notarization reads APPLE_API_KEY as a path to the .p8.
            key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s' "$APPLE_API_KEY" > "$key_path"
            export APPLE_API_KEY="$key_path"
            echo "macOS signing and notarization enabled."
            args+=(--signed)
          else
            echo "::warning::Building UNSIGNED (ad hoc). Set CSC_LINK, CSC_KEY_PASSWORD, APPLE_API_KEY, APPLE_API_KEY_ID and APPLE_API_ISSUER to sign and notarize."
          fi

          node scripts/build-desktop-artifact.ts "${args[@]}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-mac
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/*.yml
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  build_linux:
    name: Build Linux (.deb, x64 and arm64)
    needs: [preflight]
    # The app is bundled JavaScript on Electron: one runner packages both
    # architectures (electron-builder fetches each one's Electron).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: release-${{ needs.preflight.outputs.channel }}-linux
      cancel-in-progress: ${{ needs.preflight.outputs.channel == 'nightly' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Build desktop artifacts
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          OTTER_GOOGLE_CLIENT_ID: ${{ vars.OTTER_GOOGLE_CLIENT_ID }}
          OTTER_GOOGLE_CLIENT_SECRET: ${{ secrets.OTTER_MAIL_GOOGLE_CLIENT_SECRET }}
          # Outlook's sign-in (a public client: no secret); without it the app offers no Outlook.
          OTTER_MICROSOFT_CLIENT_ID: ${{ vars.OTTER_MICROSOFT_CLIENT_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
        run: |
          set -euo pipefail
          if [[ -z "$OTTER_GOOGLE_CLIENT_ID" || -z "$OTTER_GOOGLE_CLIENT_SECRET" ]]; then
            echo "::error::Set the OTTER_GOOGLE_CLIENT_ID variable and OTTER_GOOGLE_CLIENT_SECRET secret; without them the app can't sign in to Google."
            exit 1
          fi
          node scripts/build-desktop-artifact.ts --platform linux --arch x64 --build-version "$VERSION"
          node scripts/build-desktop-artifact.ts --platform linux --arch arm64 --build-version "$VERSION" --skip-build

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-linux
          path: |
            release/*.deb
            release/*.yml
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release:
    name: Publish GitHub release
    needs: [preflight, quality, build_mac, build_linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # In turn within a channel, and never cancelled: it may be publishing.
    concurrency:
      group: release-${{ needs.preflight.outputs.channel }}-publish
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          package-manager-cache: false

      # The version's changelog note (if main has one) goes above GitHub's
      # generated notes, so the release and the site's changelog say the same.
      - name: Changelog note
        if: needs.preflight.outputs.prerelease == 'false'
        run: node scripts/changelog-release-notes.ts "${{ needs.preflight.outputs.version }}" > "$RUNNER_TEMP/notes.md"

      # Each release carries only its own latest-* or nightly-* update feeds.
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: ${{ needs.preflight.outputs.name }}
          body_path: ${{ needs.preflight.outputs.prerelease == 'false' && format('{0}/notes.md', runner.temp) || '' }}
          generate_release_notes: true
          previous_tag: ${{ needs.preflight.outputs.previous_tag }}
          prerelease: ${{ needs.preflight.outputs.prerelease }}
          make_latest: ${{ needs.preflight.outputs.make_latest }}
          files: release-assets/*
          fail_on_unmatched_files: true

  # Tells Sentry which commits the version holds, so an issue a commit says
  # `Fixes <SHORT-ID>` to resolves with it. Bookkeeping: never fails the release.
  sentry_release:
    name: Sentry release
    needs: [preflight, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          fetch-depth: 0

      - name: Create the release
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
        with:
          release: otter-mail@${{ needs.preflight.outputs.version }}
          projects: otter-mail-desktop otter-mail-web
          environment: ${{ needs.preflight.outputs.prerelease == 'true' && 'nightly' || 'stable' }}
          set_commits: auto
          ignore_missing: true
          ignore_empty: true

  # A nightly's web app goes out once its checks pass, alongside the desktop builds;
  # a stable one waits for its GitHub release.
  deploy_web_nightly:
    name: Deploy the web app (nightly)
    needs: [preflight, quality]
    if: needs.preflight.outputs.prerelease == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: deploy-web-nightly
      cancel-in-progress: false
    steps: &deploy_web_steps
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Build and deploy
        working-directory: site
        env:
          OTTER_VERSION: ${{ needs.preflight.outputs.version }}
          NIGHTLY: ${{ needs.preflight.outputs.prerelease }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN secret and CLOUDFLARE_ACCOUNT_ID variable (Workers Scripts: Edit) to deploy the web app."
            exit 1
          fi
          node scripts/build.ts
          if [[ "$NIGHTLY" == "true" ]]; then
            pnpm exec wrangler deploy --env nightly
          else
            pnpm exec wrangler deploy
          fi

  deploy_web:
    name: Deploy the web app
    needs: [preflight, release]
    if: needs.preflight.outputs.prerelease == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: deploy-web-stable
      cancel-in-progress: false
    steps: *deploy_web_steps

  finalize:
    name: Bump package versions on main
    needs: [preflight, release]
    if: needs.preflight.outputs.prerelease == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          package-manager-cache: false

      - id: bump
        name: Update versions
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}" --github-output

      - name: Commit and push
        if: steps.bump.outputs.changed == 'true'
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/package.json apps/web/package.json
          git commit -m "chore(release): $TAG"
          # The iPhone release also pushes a version bump to main; don't collide with it.
          for attempt in 1 2 3; do
            git pull --rebase origin "${{ github.event.repository.default_branch }}"
            if git push origin HEAD; then exit 0; fi
            sleep 5
          done
          echo "::error::Couldn't push the version bump to main."
          exit 1
