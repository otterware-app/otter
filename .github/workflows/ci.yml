name: CI

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Nothing in CI launches Electron; skip the ~100 MB runtime download.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  # The Swift jobs need macOS runners, which the Mac release waits on too: run
  # them only when what they build changed (or this workflow did).
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      iphone: ${{ steps.filter.outputs.iphone }}
      agents: ${{ steps.filter.outputs.agents }}
      translator: ${{ steps.filter.outputs.translator }}
      hermes: ${{ steps.filter.outputs.hermes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # NUL-separated, so unusual names aren't quoted; no renames, so a move out of a
          # watched folder counts as its deletion there.
          list_changes() { git diff --name-only --no-renames -z "$@" > "$RUNNER_TEMP/changed.txt"; }
          everything() { printf '.github/workflows/ci.yml\0' > "$RUNNER_TEMP/changed.txt"; }
          changed() { grep -zqE "$1" "$RUNNER_TEMP/changed.txt" && echo true || echo false; }
          case "$EVENT" in
            pull_request) list_changes "$PR_BASE...$PR_HEAD" ;;
            # A manual run checks everything.
            *) everything ;;
          esac
          {
            echo "iphone=$(changed '^(apps/ios/|packages/shared/|package\.json$|scripts/export-ios-resources\.ts$|\.github/workflows/ci\.yml$)')"
            # Otter Agents compiles Otter Mail's agent clients and themes.
            echo "agents=$(changed '^(apps/ios-agents/|apps/ios/OtterMail/(Agent|Theme|Resources)/|apps/ios/OtterMail/Settings/(ThemeSettings|Licenses)\.swift$|\.github/workflows/ci\.yml$)')"
            echo "translator=$(changed '^(native/translator/|\.github/actions/select-xcode/|\.github/workflows/ci\.yml$)')"
            echo "hermes=$(changed '^(extensions/hermes/gateway/|\.github/workflows/ci\.yml$)')"
          } | tee -a "$GITHUB_OUTPUT"

  # A runner each: on one they slowed each other down, enough to time out tests.
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            run: |
              vp run fmt:check
              vp run lint
              node --test scripts/release.test.ts .github/scripts/release-source.test.cjs
              node scripts/resolve-release-version.ts --bump patch
              node scripts/build-desktop-artifact.ts --help > /dev/null
              node scripts/dev-runner.ts dev --dry-run
              node scripts/dev-runner.ts dev:desktop --dry-run
              node scripts/dev-runner.ts dev:desktop:fake --dry-run
          - name: Typecheck
            run: vp run typecheck
          - name: Test
            run: vp run test
          - name: Build
            run: vp run build
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}

  # Otter's Hermes plugin (extensions/hermes/gateway), against the Hermes release on PyPI.
  hermes:
    name: Hermes plugin
    needs: changes
    if: needs.changes.outputs.hermes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3

      # importlib: the plugin's folder is called gateway, like the Hermes package it imports.
      - name: Test
        run: >
          uv run --no-project --python 3.12
          --with hermes-agent==0.19.0 --with aiohttp --with pytest
          pytest -q -p no:cacheprovider --import-mode=importlib extensions/hermes/gateway/tests

  # Apple Translation's TranslationSession(installedSource:target:) is macOS 26
  # API, so the translator needs Xcode 26+ (Swift 6, macOS 26 SDK). No Node
  # needed: this only compiles the Swift package.
  translator:
    name: Translator (Swift)
    needs: changes
    if: needs.changes.outputs.translator == 'true'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        uses: ./.github/actions/select-xcode
        with:
          # Pin a path (e.g. /Applications/Xcode_26.0.app) if the newest misbehaves.
          xcode-app: ${{ vars.XCODE_APP }}

      - name: Build translator (Apple Silicon)
        run: swift build -c release --package-path native/translator --arch arm64

  iphone:
    name: iPhone (Swift)
    needs: changes
    if: needs.changes.outputs.iphone == 'true'
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Export shared resources
        run: node scripts/export-ios-resources.ts

      # One thing at a time: booting the simulator alongside the build slowed both down.
      # Simulators on the runner are Apple silicon: arm64 alone, not the Intel slice too.
      - name: Build app, extension and tests
        run: |
          xcodebuild -version
          xcodebuild -project apps/ios/OtterMail.xcodeproj -scheme OtterMail \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/otter-ios-build" \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO build-for-testing

      - name: Boot a simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > "$RUNNER_TEMP/devices.json"
          simulator="$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const devices = JSON.parse(readFileSync(process.argv[1], "utf8"));
            const device = Object.values(devices.devices).flat().find(d => d.name.startsWith("iPhone"));
            if (!device) throw new Error("No available iPhone simulator on the Xcode runner.");
            console.log(device.udid);
          ' "$RUNNER_TEMP/devices.json")"
          echo "IPHONE_SIMULATOR=$simulator" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator" || true
          xcrun simctl bootstatus "$simulator" -b

      - name: Run native tests
        run: |
          xcodebuild -project apps/ios/OtterMail.xcodeproj -scheme OtterMail \
            -destination "platform=iOS Simulator,id=$IPHONE_SIMULATOR" \
            -derivedDataPath "$RUNNER_TEMP/otter-ios-build" \
            -resultBundlePath "$RUNNER_TEMP/otter-ios-tests.xcresult" \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO test-without-building

      - name: Capture demo in light and dark
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/otter-ios-preview"
          xcrun simctl ui "$IPHONE_SIMULATOR" appearance light
          xcrun simctl launch --terminate-running-process "$IPHONE_SIMULATOR" \
            dev.otterware.mail.dev -otter:demo YES
          # The simulator can return from launch before the first SwiftUI frame.
          # Allow cold-start resource loading before taking the demo screenshots.
          sleep 15
          xcrun simctl io "$IPHONE_SIMULATOR" screenshot "$RUNNER_TEMP/otter-ios-preview/light.png"
          xcrun simctl ui "$IPHONE_SIMULATOR" appearance dark
          sleep 2
          xcrun simctl io "$IPHONE_SIMULATOR" screenshot "$RUNNER_TEMP/otter-ios-preview/dark.png"

      - name: Upload native results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: iphone-verification
          path: |
            ${{ runner.temp }}/otter-ios-tests.xcresult
            ${{ runner.temp }}/otter-ios-preview
          if-no-files-found: ignore
          retention-days: 7

  agents:
    name: iPhone, Otter Agents (Swift)
    needs: changes
    if: needs.changes.outputs.agents == 'true'
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build app and tests
        run: |
          xcodebuild -version
          xcodebuild -project apps/ios-agents/OtterAgents.xcodeproj -scheme OtterAgents \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/otter-agents-build" \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO build-for-testing

      - name: Boot a simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > "$RUNNER_TEMP/devices.json"
          simulator="$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const devices = JSON.parse(readFileSync(process.argv[1], "utf8"));
            const device = Object.values(devices.devices).flat().find(d => d.name.startsWith("iPhone"));
            if (!device) throw new Error("No available iPhone simulator on the Xcode runner.");
            console.log(device.udid);
          ' "$RUNNER_TEMP/devices.json")"
          echo "IPHONE_SIMULATOR=$simulator" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator" || true
          xcrun simctl bootstatus "$simulator" -b

      - name: Run native tests
        run: |
          xcodebuild -project apps/ios-agents/OtterAgents.xcodeproj -scheme OtterAgents \
            -destination "platform=iOS Simulator,id=$IPHONE_SIMULATOR" \
            -derivedDataPath "$RUNNER_TEMP/otter-agents-build" \
            -resultBundlePath "$RUNNER_TEMP/otter-agents-tests.xcresult" \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO test-without-building

      - name: Upload native results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agents-verification
          path: ${{ runner.temp }}/otter-agents-tests.xcresult
          if-no-files-found: ignore
          retention-days: 7
