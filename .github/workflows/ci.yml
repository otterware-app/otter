name: CI

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Nothing in CI launches Electron; skip the ~100 MB runtime download.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  # The Xcode jobs need macOS runners, which the Mac release waits on too: run
  # them only when what they build changed (or this workflow did).
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mail: ${{ steps.filter.outputs.mail }}
      agents: ${{ steps.filter.outputs.agents }}
      translator: ${{ steps.filter.outputs.translator }}
      hermes: ${{ steps.filter.outputs.hermes }}
      package: ${{ steps.filter.outputs.package }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # NUL-separated, so unusual names aren't quoted; no renames, so a move out of a
          # watched folder counts as its deletion there.
          list_changes() { git diff --name-only --no-renames -z "$@" > "$RUNNER_TEMP/changed.txt"; }
          everything() { printf '.github/workflows/ci.yml\0' > "$RUNNER_TEMP/changed.txt"; }
          changed() { grep -zqE "$1" "$RUNNER_TEMP/changed.txt" && echo true || echo false; }
          case "$EVENT" in
            pull_request) list_changes "$PR_BASE...$PR_HEAD" ;;
            # A manual run checks everything.
            *) everything ;;
          esac
          {
            echo "mail=$(changed '^(apps/mail-mobile/|packages/(core|client|contracts|mobile|ui-native|shared)/|extensions/translation/|patches/|package\.json$|pnpm-(lock\.yaml|workspace\.yaml)$|\.github/(actions/setup/|workflows/ci\.yml$))')"
            echo "agents=$(changed '^(apps/agents-mobile/|packages/(core|client|contracts|mobile|ui-native|shared)/|extensions/(hermes|openclaw|varys|claude|codex)/|package\.json$|pnpm-(lock\.yaml|workspace\.yaml)$|\.github/(actions/setup/|workflows/ci\.yml$))')"
            echo "translator=$(changed '^(native/translator/|\.github/actions/select-xcode/|\.github/workflows/ci\.yml$)')"
            echo "hermes=$(changed '^(extensions/hermes/gateway/|\.github/workflows/ci\.yml$)')"
            echo "package=$(changed '^(scripts/(build-desktop-artifact|build-translator|build-notifier|notarize-mac|upload-sourcemaps)\.ts$|native/|apps/desktop/(package\.json$|resources/)|\.github/actions/(select-xcode|setup)/|\.github/workflows/ci\.yml$)')"
          } | tee -a "$GITHUB_OUTPUT"

  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build
        run: vp run build

  # What a release builds, unsigned, when what packages it changed: otherwise a release is the
  # first to run it.
  package:
    name: Package (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.package == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Mac
            runner: macos-15
            platform: mac
          - name: Linux
            runner: ubuntu-24.04
            platform: linux
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Select Xcode
        if: matrix.platform == 'mac'
        uses: ./.github/actions/select-xcode
        with:
          xcode-app: ${{ vars.XCODE_APP }}

      # A nightly's version, for a nightly's icon and update feed.
      - name: Build desktop artifacts
        env:
          PLATFORM: ${{ matrix.platform }}
        run: node scripts/build-desktop-artifact.ts --platform "$PLATFORM" --build-version 0.0.0-nightly.20260101.1

  # Otter's Hermes plugin (extensions/hermes/gateway), against the Hermes release on PyPI.
  hermes:
    name: Hermes plugin
    needs: changes
    if: needs.changes.outputs.hermes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3

      # importlib: the plugin's folder is called gateway, like the Hermes package it imports.
      - name: Test
        run: >
          uv run --no-project --python 3.12
          --with hermes-agent==0.19.0 --with aiohttp --with pytest
          pytest -q -p no:cacheprovider --import-mode=importlib extensions/hermes/gateway/tests

  # Apple Translation's TranslationSession(installedSource:target:) is macOS 26
  # API, so the translator needs Xcode 26+ (Swift 6, macOS 26 SDK). No Node
  # needed: this only compiles the Swift package.
  translator:
    name: Translator (Swift)
    needs: changes
    if: needs.changes.outputs.translator == 'true'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        uses: ./.github/actions/select-xcode
        with:
          # Pin a path (e.g. /Applications/Xcode_26.0.app) if the newest misbehaves.
          xcode-app: ${{ vars.XCODE_APP }}

      - name: Build translator (Apple Silicon)
        run: swift build -c release --package-path native/translator --arch arm64

  mail:
    name: iPhone, Otter Mail
    needs: mail-native
    if: needs.mail-native.outputs.changed == 'true'
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      OTTER_APP_VARIANT: production
      EXPO_NO_DOTENV: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Expo workspace
        uses: ./.github/actions/setup

      - name: Generate native project
        working-directory: apps/mail-mobile
        run: |
          pnpm exec expo prebuild --platform ios --clean --no-install
          cd ios
          pod install

      - name: Build Expo app and extension
        run: |
          xcodebuild -workspace apps/mail-mobile/ios/OtterMail.xcworkspace -scheme OtterMail \
            -configuration Release -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/otter-mail-build" \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO build

  # An Expo app's Xcode build takes ~20 minutes, mostly React Native's pods. Most changes are
  # JavaScript, which Checks covers: build only when the native app's fingerprint
  # (scripts/ios-runtime.ts) differs from the base's, or the lockfile changed.
  mail-native:
    name: Otter Mail, native changes
    needs: changes
    if: needs.changes.outputs.mail == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      IOS_APP: mail
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps: &native_steps
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Expo workspace
        uses: ./.github/actions/setup

      - id: compare
        name: Compare with the base
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          runtime() { node scripts/ios-runtime.ts --app "$IOS_APP" | grep -oE '[0-9a-f]{40}\.$' | tr -d .; }
          if [[ "$EVENT" != pull_request ]] ||
            ! git diff --quiet "$PR_BASE" HEAD -- pnpm-lock.yaml; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          head="$(runtime)"
          git checkout -q --detach "$(git merge-base "$PR_BASE" HEAD)"
          base="$(runtime)"
          echo "Head $head, base $base."
          echo "changed=$([[ "$head" != "$base" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  agents-native:
    name: Otter Agents, native changes
    needs: changes
    if: needs.changes.outputs.agents == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      IOS_APP: agents
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps: *native_steps

  agents:
    name: iPhone, Otter Agents
    needs: agents-native
    if: needs.agents-native.outputs.changed == 'true'
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Expo workspace
        uses: ./.github/actions/setup

      - name: Generate native project
        working-directory: apps/agents-mobile
        env:
          OTTER_APP_VARIANT: production
          OTTER_AGENTS_RELEASE_BUILD: "1"
          EXPO_NO_DOTENV: "1"
        run: |
          pnpm exec expo prebuild --platform ios --clean --no-install
          cd ios
          pod install

      - name: Build Expo app and extension
        env:
          OTTER_APP_VARIANT: production
          OTTER_AGENTS_RELEASE_BUILD: "1"
          EXPO_NO_DOTENV: "1"
        run: |
          xcodebuild -workspace apps/agents-mobile/ios/OtterAgents.xcworkspace -scheme OtterAgents \
            -configuration Release -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/otter-agents-build" \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO build
