name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Nothing in CI launches Electron; skip the ~100 MB runtime download.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  # The native jobs need macOS runners, which the Mac release waits on too: run
  # them only when what they build changed (or this workflow did), and not again
  # on main, where each merge's release builds the translator and the PR built the app.
  changes:
    name: Changes
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
      translator: ${{ steps.filter.outputs.translator }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # NUL-separated, so unusual names aren't quoted; no renames, so a move out of a
          # watched folder counts as its deletion there.
          list_changes() { git diff --name-only --no-renames -z "$@" > "$RUNNER_TEMP/changed.txt"; }
          everything() { printf '.github/workflows/ci.yml\0' > "$RUNNER_TEMP/changed.txt"; }
          changed() { grep -zqE "$1" "$RUNNER_TEMP/changed.txt" && echo true || echo false; }
          case "$EVENT" in
            pull_request) list_changes "$PR_BASE...$PR_HEAD" ;;
            # A manual run checks everything.
            *) everything ;;
          esac
          {
            echo "mobile=$(changed '^(apps/mobile/|packages/(core|contracts|shared|client-runtime)/|extensions/|pnpm-lock\.yaml$|package\.json$|\.github/workflows/ci\.yml$)')"
            echo "translator=$(changed '^(native/translator/|\.github/actions/select-xcode/|\.github/workflows/ci\.yml$)')"
          } | tee -a "$GITHUB_OUTPUT"

  # A runner each: on one they slowed each other down, enough to time out tests.
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            run: |
              vp run fmt:check
              vp run lint
              node --test scripts/release.test.ts .github/scripts/release-source.test.cjs
              node scripts/resolve-release-version.ts --bump patch
              node scripts/build-desktop-artifact.ts --help > /dev/null
              node scripts/dev-runner.ts dev --dry-run
              node scripts/dev-runner.ts dev:desktop --dry-run
          - name: Typecheck
            run: vp run typecheck
          - name: Test
            run: vp run test
          - name: Build
            run: vp run build
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}

  # Apple Translation's TranslationSession(installedSource:target:) is macOS 26
  # API, so the translator needs Xcode 26+ (Swift 6, macOS 26 SDK). No Node
  # needed: this only compiles the Swift package.
  translator:
    name: Translator (Swift)
    needs: changes
    if: needs.changes.outputs.translator == 'true'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        uses: ./.github/actions/select-xcode
        with:
          # Pin a path (e.g. /Applications/Xcode_26.0.app) if the newest misbehaves.
          xcode-app: ${{ vars.XCODE_APP }}

      - name: Build translator (Apple Silicon)
        run: swift build -c release --package-path native/translator --arch arm64

  # The iPhone app (apps/mobile): its tests, the development variant's Release build on the
  # made-up mailbox in a simulator (light and dark screenshots), and the release's unsigned
  # production archive (scripts/release-ios.ts).
  mobile:
    name: iPhone (Expo)
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Mobile tests
        working-directory: apps/mobile
        run: vp run test

      - name: Prebuild (development, made-up mailbox)
        working-directory: apps/mobile
        env:
          APP_VARIANT: development
          OTTER_MAIL_FAKE_MAILBOX: "1"
          EXPO_NO_GIT_STATUS: "1"
        run: npx expo prebuild --clean --platform ios

      # Simulators on the runner are Apple silicon: arm64 alone, not the Intel slice too.
      - name: Build for the simulator (Release)
        working-directory: apps/mobile/ios
        run: |
          xcodebuild -version
          xcodebuild -workspace OtterMailDev.xcworkspace -scheme OtterMailDev \
            -configuration Release -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/mobile-build" \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO -quiet build

      - name: Boot a simulator, install and launch
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > "$RUNNER_TEMP/devices.json"
          simulator="$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const devices = JSON.parse(readFileSync(process.argv[1], "utf8"));
            const device = Object.values(devices.devices).flat().find(d => d.name.startsWith("iPhone"));
            if (!device) throw new Error("No available iPhone simulator on the Xcode runner.");
            console.log(device.udid);
          ' "$RUNNER_TEMP/devices.json")"
          echo "IPHONE_SIMULATOR=$simulator" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator" || true
          xcrun simctl bootstatus "$simulator" -b
          app="$(ls -d "$RUNNER_TEMP"/mobile-build/Build/Products/Release-iphonesimulator/*.app | head -n1)"
          xcrun simctl install "$simulator" "$app"
          xcrun simctl ui "$simulator" appearance light
          xcrun simctl launch "$simulator" dev.otterware.mail.dev

      - name: Capture the made-up mailbox in light and dark
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mobile-preview"
          # Core starts on its own runtime and syncs the made-up mailbox before the list fills.
          sleep 20
          xcrun simctl io "$IPHONE_SIMULATOR" screenshot "$RUNNER_TEMP/mobile-preview/light.png"
          xcrun simctl ui "$IPHONE_SIMULATOR" appearance dark
          sleep 3
          xcrun simctl io "$IPHONE_SIMULATOR" screenshot "$RUNNER_TEMP/mobile-preview/dark.png"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: iphone-verification
          path: ${{ runner.temp }}/mobile-preview
          if-no-files-found: ignore
          retention-days: 7

      - name: Production archive (unsigned)
        run: node scripts/release-ios.ts --unsigned
