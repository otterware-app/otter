packages:
  - apps/*
  - apps/mobile/modules/*
  - packages/*
  - extensions/*
  - site
  - infra/*
allowBuilds:
  "@sentry/cli": false
  electron: true
  electron-winstaller: false
  esbuild: true
  sharp: false
  workerd: true

catalog:
  "@effect/atom-react": 4.1.2
  "@effect/vitest": 4.1.2
  "@legendapp/list": 3.3.5
  "@noble/curves": 1.9.1
  "@noble/hashes": 1.8.0
  "@types/node": 24.12.4
  "@types/react": ~19.3.0
  "@tailwindcss/vite": 4.3.3
  effect: 4.1.2
  tailwindcss: 4.3.3
  typescript: 5.9.3
  vite: npm:@voidzero-dev/vite-plus-core@0.3.3
  vite-plus: 0.3.3

minimumReleaseAgeExclude:
  - "@effect/atom-react@4.1.2"
  - "@effect/vitest@4.1.2"
  - effect@4.1.2
  - expo-modules-core@58.0.22
  - "@cloudflare/workerd-darwin-64@1.20260925.1"
  - "@cloudflare/workerd-darwin-arm64@1.20260925.1"
  - "@cloudflare/workerd-linux-64@1.20260925.1"
  - "@cloudflare/workerd-linux-arm64@1.20260925.1"
  - "@cloudflare/workerd-windows-64@1.20260925.1"
  - miniflare@5.20260925.0-alpha
  - workerd@1.20260925.1
  - wrangler@4.141.0

overrides:
  "@effect/vitest>vitest": "-"
  effect: "catalog:"
  # As Otter Code's apps/mobile: Expo's precompiled ExpoModulesCore newer than
  # 58.0.22 links React symbols React Native 0.88.0 doesn't have (dyld fails at launch).
  expo-modules-core: 58.0.22
  # Move with @react-navigation/native: an older core than it requires crashes native stacks at launch.
  "@react-navigation/core": 7.24.0

# Our patch makes @effect/vitest import vite-plus/test, as Otter Code's does.
packageExtensions:
  "@effect/vitest@*":
    dependencies:
      vite-plus: 0.3.3

patchedDependencies:
  "@effect/vitest@4.1.2": patches/@effect__vitest@4.1.2.patch
