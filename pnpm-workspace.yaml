packages:
  - apps/*
  - packages/*
  - extensions/*
  - site
  - infra/*
allowBuilds:
  "@sentry/cli": false
  electron: true
  electron-winstaller: false
  esbuild: true
  react-native-enriched-markdown: false
  sharp: false
  workerd: true

catalog:
  "@tanstack/react-query": 5.103.2
  "@types/node": 24.12.4
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  expo: ~58.0.26
  expo-glass-effect: ~58.0.5
  expo-haptics: ~58.0.8
  expo-image: ~58.0.18
  expo-symbols: ~58.0.5
  "@tailwindcss/vite": 4.3.3
  react: 19.3.0
  react-dom: 19.3.0
  react-native: 0.88.1
  react-native-gesture-handler: ~3.3.0
  react-native-reanimated: 4.7.1
  react-native-safe-area-context: ~5.11.1
  react-native-svg: 15.16.0
  react-native-worklets: 0.13.0
  tailwindcss: 4.3.3
  typescript: 5.9.3
  vite: npm:@voidzero-dev/vite-plus-core@0.3.3
  vite-plus: 0.3.3
  zustand: 5.0.15

minimumReleaseAgeExclude:
  - "@cloudflare/workerd-darwin-64@1.20260925.1"
  - "@cloudflare/workerd-darwin-arm64@1.20260925.1"
  - "@cloudflare/workerd-linux-64@1.20260925.1"
  - "@cloudflare/workerd-linux-arm64@1.20260925.1"
  - "@cloudflare/workerd-windows-64@1.20260925.1"
  - miniflare@5.20260925.0-alpha
  - workerd@1.20260925.1
  - wrangler@4.141.0
  - "@generalpursuit/varys@0.4.0"

patchedDependencies:
  expo-dev-launcher@58.0.21: patches/expo-dev-launcher@58.0.21.patch

overrides:
  # One copy of the native module: an optional peer of Expo's, which pnpm would otherwise resolve
  # to its newest version where an app's pinned one isn't in reach.
  react-native-worklets: "catalog:"
