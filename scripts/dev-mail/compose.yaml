name: otter-mail-dev-mail
services:
  dovecot:
    image: dovecot/dovecot:2.4.5
    environment:
      USER_PASSWORD: pass # any user name, this password
    ports:
      - "127.0.0.1:31993:31993" # IMAP, TLS
      - "127.0.0.1:31143:31143" # IMAP, STARTTLS
      - "127.0.0.1:31465:31465" # SMTP submission, TLS
      - "127.0.0.1:31587:31587" # SMTP submission, STARTTLS
    volumes:
      - ./dovecot.conf:/etc/dovecot/conf.d/otter-mail-dev.conf:ro
      - ${OTTER_MAIL_DEV_MAIL_CERTS:?run pnpm dev:mail}/tls.crt:/etc/dovecot/ssl/tls.crt:ro
      - ${OTTER_MAIL_DEV_MAIL_CERTS:?run pnpm dev:mail}/tls.key:/etc/dovecot/ssl/tls.key:ro
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"
