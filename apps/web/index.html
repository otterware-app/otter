<!doctype html>
<html lang="en" class="no-background">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' http://localhost:*; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http://localhost:*; font-src 'self' data:; connect-src 'self' https: wss: http://localhost:* ws://localhost:*; media-src 'self' data: blob: https:; frame-src 'self' blob: data: https://usercontent.otterware.app; object-src 'none'; base-uri 'self'"
    />
    <title>Otter</title>
    <script>
      var chosen = localStorage.getItem("otter:theme-source");
      var dark = chosen
        ? chosen === "dark"
        : window.matchMedia("(prefers-color-scheme: dark)").matches;
      if (dark) document.documentElement.classList.add("dark");
      // A theme with a design (apply-theme.ts), so its first paint is already its own.
      if (localStorage.getItem(dark ? "otter:theme:dark" : "otter:theme:light") === "margin") {
        document.documentElement.setAttribute("data-design", "margin");
      }
    </script>
    <style>
      /* Transparent base so the window's native vibrancy material shows
         through; the app paints its own translucent frame on top. */
      html,
      body,
      #root {
        background: transparent;
      }
      html[data-platform="web"],
      html[data-platform="web"] body {
        background: var(--canvas);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main/index.tsx"></script>
  </body>
</html>
